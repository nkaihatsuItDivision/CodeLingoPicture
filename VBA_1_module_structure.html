<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>標準モジュール追加後の構成</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .tree-box { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .tree { font-family: 'Consolas', 'Monaco', monospace; font-size: 1rem; line-height: 2; }
    .tree-item { display: flex; align-items: center; gap: 10px; }
    .tree-item.level-0 { margin-left: 0; }
    .tree-item.level-1 { margin-left: 30px; }
    .tree-item.level-2 { margin-left: 60px; }
    .icon { font-size: 1.2rem; }
    .text { color: #333; }
    .highlight { background: linear-gradient(90deg, #fff3cd 0%, #ffeaa7 100%); padding: 4px 12px; border-radius: 6px; font-weight: bold; position: relative; }
    .highlight::after { content: '← 新規追加！'; color: #e74c3c; font-size: 0.8rem; margin-left: 10px; font-weight: bold; }
    .folder-new { color: #e67e22; font-weight: bold; }
    .note { background: #f8f9fa; border-left: 4px solid #3498db; padding: 16px; margin-top: 24px; border-radius: 0 8px 8px 0; }
    .note-title { color: #3498db; font-weight: bold; margin-bottom: 8px; }
    .note-text { color: #555; font-size: 0.9rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>標準モジュール追加後の構成</h1>
    <div class="tree-box">
      <div class="tree">
        <div class="tree-item level-0">
          <span class="icon">📁</span>
          <span class="text"><strong>VBAProject (Book1.xlsm)</strong></span>
        </div>
        <div class="tree-item level-1">
          <span class="icon">📁</span>
          <span class="text">Microsoft Excel Objects</span>
        </div>
        <div class="tree-item level-2">
          <span class="icon">📄</span>
          <span class="text">Sheet1 (Sheet1)</span>
        </div>
        <div class="tree-item level-2">
          <span class="icon">📄</span>
          <span class="text">ThisWorkbook</span>
        </div>
        <div class="tree-item level-1">
          <span class="icon">📁</span>
          <span class="text folder-new">標準モジュール</span>
        </div>
        <div class="tree-item level-2">
          <span class="icon">📄</span>
          <span class="highlight">Module1</span>
        </div>
      </div>
      <div class="note">
        <div class="note-title">💡 作成手順</div>
        <div class="note-text">
          VBEメニューから<br>
          <strong>「挿入」→「標準モジュール」</strong><br>
          を選択すると、「標準モジュール」フォルダと「Module1」が自動的に作成されます。
        </div>
      </div>
    </div>
  </div>
</body>
</html>

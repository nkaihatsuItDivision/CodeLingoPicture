<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>開発タブの位置</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #1e5128 0%, #4e9f3d 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .excel-window { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.3); }
    .title-bar { background: #217346; color: #fff; padding: 8px 16px; font-size: 0.9rem; display: flex; align-items: center; gap: 10px; }
    .title-bar-icon { font-size: 1.2rem; }
    .ribbon-tabs { background: #f3f3f3; display: flex; border-bottom: 1px solid #d0d0d0; overflow-x: auto; }
    .tab { padding: 10px 16px; font-size: 0.85rem; color: #444; cursor: pointer; white-space: nowrap; border-bottom: 3px solid transparent; }
    .tab:hover { background: #e8e8e8; }
    .tab.highlight { background: #fff3cd; color: #856404; font-weight: bold; border-bottom: 3px solid #ffc107; position: relative; }
    .tab.highlight::after { content: '👆 ここ！'; position: absolute; top: -30px; left: 50%; transform: translateX(-50%); background: #ffc107; color: #333; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; white-space: nowrap; }
    .ribbon-content { background: #f8f8f8; padding: 20px; min-height: 80px; display: flex; align-items: center; justify-content: center; color: #888; font-size: 0.9rem; }
    .note { background: #fff; border-radius: 12px; padding: 20px; margin-top: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .note-title { color: #217346; font-weight: bold; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .note-text { color: #333; font-size: 0.95rem; line-height: 1.8; }
    .note-text strong { color: #217346; }
  </style>
</head>
<body>
  <div class="container">
    <h1>開発タブの位置</h1>
    <div class="excel-window">
      <div class="title-bar">
        <span class="title-bar-icon">📊</span>
        <span>Book1 - Excel</span>
      </div>
      <div class="ribbon-tabs">
        <div class="tab">ファイル</div>
        <div class="tab">ホーム</div>
        <div class="tab">挿入</div>
        <div class="tab">ページレイアウト</div>
        <div class="tab">数式</div>
        <div class="tab">データ</div>
        <div class="tab">校閲</div>
        <div class="tab">表示</div>
        <div class="tab highlight">開発</div>
        <div class="tab">ヘルプ</div>
      </div>
      <div class="ribbon-content">
        （リボンの内容がここに表示されます）
      </div>
    </div>
    <div class="note">
      <div class="note-title">💡 ポイント</div>
      <div class="note-text">
        <strong>「開発」タブ</strong>は初期設定では非表示です。<br>
        ファイル → オプション → リボンのユーザー設定 から表示を有効にしてください。<br>
        このタブから<strong>Visual Basic</strong>（VBE）を起動できます。
      </div>
    </div>
  </div>
</body>
</html>

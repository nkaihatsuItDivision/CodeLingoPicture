<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>検索フォームの例</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .content { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .form-demo { background: #f0f0f0; border: 2px solid #333; border-radius: 8px; max-width: 500px; margin: 20px auto; overflow: hidden; }
    .form-titlebar { background: linear-gradient(180deg, #0078d7, #0063b1); color: #fff; padding: 8px 12px; font-weight: bold; font-size: 0.9rem; }
    .form-body { padding: 20px; background: #f0f0f0; }
    .search-row { display: flex; gap: 10px; margin-bottom: 15px; align-items: center; }
    .search-label { min-width: 80px; font-size: 0.9rem; }
    .search-input { flex: 1; padding: 6px 10px; border: 1px solid #999; border-radius: 3px; }
    .search-btn { padding: 6px 20px; background: #0078d7; color: #fff; border: 1px solid #0063b1; border-radius: 3px; cursor: pointer; }
    .result-list { border: 1px solid #999; background: #fff; height: 120px; overflow: auto; }
    .result-header { display: flex; background: #e1e1e1; font-weight: bold; font-size: 0.8rem; }
    .result-row { display: flex; font-size: 0.85rem; border-bottom: 1px solid #eee; }
    .result-row:hover { background: #e3f2fd; }
    .result-row.selected { background: #0078d7; color: #fff; }
    .result-cell { padding: 6px 8px; flex: 1; }
    .form-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 15px; }
    .form-btn { padding: 6px 20px; border: 1px solid #999; border-radius: 3px; background: #e1e1e1; cursor: pointer; }
    .flow { display: flex; gap: 20px; margin: 30px 0; flex-wrap: wrap; justify-content: center; }
    .flow-item { background: #f8f9fa; border-radius: 8px; padding: 16px; text-align: center; min-width: 140px; }
    .flow-num { width: 30px; height: 30px; background: #0078d7; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 10px; font-weight: bold; }
    .flow-arrow { align-self: center; font-size: 1.5rem; color: #666; }
  </style>
</head>
<body>
  <div class="container">
    <h1>実践：検索フォーム</h1>
    <div class="content">
      <div class="form-demo">
        <div class="form-titlebar">従業員検索</div>
        <div class="form-body">
          <div class="search-row">
            <span class="search-label">検索条件:</span>
            <input type="text" class="search-input" placeholder="氏名または部署">
            <button class="search-btn">検索</button>
          </div>
          
          <div class="result-list">
            <div class="result-header">
              <div class="result-cell">ID</div>
              <div class="result-cell">氏名</div>
              <div class="result-cell">部署</div>
            </div>
            <div class="result-row">
              <div class="result-cell">1001</div>
              <div class="result-cell">田中太郎</div>
              <div class="result-cell">営業部</div>
            </div>
            <div class="result-row selected">
              <div class="result-cell">1002</div>
              <div class="result-cell">田中花子</div>
              <div class="result-cell">開発部</div>
            </div>
            <div class="result-row">
              <div class="result-cell">1003</div>
              <div class="result-cell">田中一郎</div>
              <div class="result-cell">総務部</div>
            </div>
          </div>
          
          <div class="form-buttons">
            <button class="form-btn">閉じる</button>
            <button class="form-btn" style="background:#0078d7;color:#fff;border-color:#0063b1;">選択</button>
          </div>
        </div>
      </div>
      
      <div class="flow">
        <div class="flow-item">
          <div class="flow-num">1</div>
          <strong>検索条件入力</strong><br>
          <small>TextBox</small>
        </div>
        <div class="flow-arrow">→</div>
        <div class="flow-item">
          <div class="flow-num">2</div>
          <strong>検索実行</strong><br>
          <small>Button_Click</small>
        </div>
        <div class="flow-arrow">→</div>
        <div class="flow-item">
          <div class="flow-num">3</div>
          <strong>結果表示</strong><br>
          <small>ListBox</small>
        </div>
        <div class="flow-arrow">→</div>
        <div class="flow-item">
          <div class="flow-num">4</div>
          <strong>選択・確定</strong><br>
          <small>ListBox_DblClick</small>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

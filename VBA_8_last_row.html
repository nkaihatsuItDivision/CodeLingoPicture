<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>最終行の取得方法</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .content { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .demo { display: flex; gap: 30px; align-items: flex-start; flex-wrap: wrap; justify-content: center; margin: 20px 0; }
    .excel-col { display: flex; flex-direction: column; gap: 2px; }
    .cell { width: 80px; height: 30px; border: 1px solid #ccc; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; background: #fff; }
    .header { background: #e0e0e0; font-weight: bold; }
    .data { background: #e3f2fd; }
    .empty { background: #f5f5f5; color: #999; }
    .last { background: #d4edda; border: 2px solid #28a745; font-weight: bold; }
    .bottom { background: #ffcdd2; border: 2px solid #e74c3c; }
    .arrow-box { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .arrow { font-size: 2rem; color: #e74c3c; }
    .arrow-text { font-size: 0.8rem; color: #666; text-align: center; }
    .code-block { background: #1e1e1e; border-radius: 8px; padding: 20px; margin: 20px 0; }
    .code-block pre { color: #d4d4d4; font-family: 'Consolas', monospace; font-size: 0.9rem; line-height: 1.8; }
    .keyword { color: #569cd6; }
    .type { color: #4ec9b0; }
    .comment { color: #6a9955; }
    .step { background: #f8f9fa; border-radius: 8px; padding: 12px; margin: 10px 0; }
    .step-num { display: inline-block; width: 24px; height: 24px; background: #667eea; color: #fff; border-radius: 50%; text-align: center; line-height: 24px; font-size: 0.8rem; margin-right: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>最終行の取得方法</h1>
    <div class="content">
      <div class="demo">
        <div class="excel-col">
          <div class="cell header">A列</div>
          <div class="cell data">田中</div>
          <div class="cell data">山田</div>
          <div class="cell data">鈴木</div>
          <div class="cell last">佐藤 ← 最終行</div>
          <div class="cell empty">（空）</div>
          <div class="cell empty">...</div>
          <div class="cell bottom">1048576行目</div>
        </div>
        <div class="arrow-box">
          <div class="arrow">↑</div>
          <div class="arrow-text">End(xlUp)で<br>上に検索</div>
        </div>
      </div>
      
      <div class="step">
        <span class="step-num">1</span>
        A列の最終セル（A1048576）から開始
      </div>
      <div class="step">
        <span class="step-num">2</span>
        End(xlUp)で上方向にデータを探す
      </div>
      <div class="step">
        <span class="step-num">3</span>
        最初に見つかったセルの行番号を取得
      </div>
      
      <div class="code-block">
        <pre><span class="keyword">Dim</span> lastRow <span class="keyword">As</span> <span class="type">Long</span>

<span class="comment">' A列の最終行を取得</span>
lastRow = Cells(Rows.Count, 1).End(xlUp).Row

<span class="comment">' 結果: lastRow = 4</span></pre>
      </div>
      
      <p style="text-align:center; color:#666; margin-top:16px;">
        <strong>💡 これはVBAで最もよく使うテクニックの1つです！</strong>
      </p>
    </div>
  </div>
</body>
</html>

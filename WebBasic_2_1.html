<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTTPプロトコルの概念図</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            width: 900px;
            text-align: center;
        }
        
        .title {
            color: #333;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 40px;
        }
        
        .http-breakdown {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
        }
        
        .acronym-display {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .letter-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            width: 80px;
            height: 80px;
            border-radius: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 36px;
            font-weight: bold;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }
        
        .plus-sign {
            font-size: 24px;
            color: #666;
            font-weight: bold;
        }
        
        .word-explanations {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin: 30px 0;
        }
        
        .word-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }
        
        .word-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }
        
        .word-meaning {
            font-size: 14px;
            color: #666;
            line-height: 1.4;
        }
        
        .hyper { border-color: #667eea; }
        .hyper .word-title { color: #667eea; }
        
        .text { border-color: #00b894; }
        .text .word-title { color: #00b894; }
        
        .transfer { border-color: #fd79a8; }
        .transfer .word-title { color: #fd79a8; }
        
        .protocol { border-color: #fdcb6e; }
        .protocol .word-title { color: #fdcb6e; }
        
        .final-meaning {
            background: linear-gradient(135deg, #74b9ff 0%, #0984e3 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            margin-top: 30px;
        }
        
        .final-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .final-description {
            font-size: 16px;
            line-height: 1.5;
        }
        
        .visual-representation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
        }
        
        .device {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        
        .device-icon {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            margin-bottom: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .browser-icon {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }
        
        .server-icon {
            background: linear-gradient(135deg, #fd79a8, #e84393);
        }
        
        .device-label {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }
        
        .device-description {
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        
        .protocol-flow {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0 20px;
        }
        
        .protocol-label {
            background: #667eea;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }
        
        .flow-lines {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        
        .flow-line {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .arrow {
            color: #667eea;
            font-size: 20px;
        }
        
        .flow-text {
            font-size: 12px;
            color: #666;
            min-width: 120px;
        }
        
        .examples-section {
            background: #ffffff;
            border: 2px solid #e9ecef;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }
        
        .examples-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .examples-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }
        
        .example-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid #e9ecef;
        }
        
        .example-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .example-text {
            font-size: 12px;
            color: #666;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">HTTPプロトコルの概念</div>
        
        <div class="http-breakdown">
            <div class="acronym-display">
                <div class="letter-box">H</div>
                <div class="letter-box">T</div>
                <div class="letter-box">T</div>
                <div class="letter-box">P</div>
            </div>
            
            <div class="word-explanations">
                <div class="word-card hyper">
                    <div class="word-title">HyperText</div>
                    <div class="word-meaning">
                        リンクでつながった<br>
                        Webページや文書
                    </div>
                </div>
                
                <div class="word-card transfer">
                    <div class="word-title">Transfer</div>
                    <div class="word-meaning">
                        転送・やり取り<br>
                        データを送受信する
                    </div>
                </div>
                
                <div class="word-card protocol">
                    <div class="word-title">Protocol</div>
                    <div class="word-meaning">
                        約束事・ルール<br>
                        通信の決まりごと
                    </div>
                </div>
            </div>
            
            <div class="final-meaning">
                <div class="final-title">つまり HTTP とは？</div>
                <div class="final-description">
                    「Webページをやり取りするための共通のルール」
                </div>
            </div>
        </div>
        
        <div class="visual-representation">
            <div class="device">
                <div class="device-icon browser-icon">💻</div>
                <div class="device-label">ブラウザ</div>
                <div class="device-description">Webページを<br>見たい人</div>
            </div>
            
            <div class="protocol-flow">
                <div class="protocol-label">HTTP</div>
                <div class="flow-lines">
                    <div class="flow-line">
                        <div class="flow-text">ページください</div>
                        <div class="arrow">→</div>
                    </div>
                    <div class="flow-line">
                        <div class="arrow">←</div>
                        <div class="flow-text">はい、どうぞ</div>
                    </div>
                </div>
            </div>
            
            <div class="device">
                <div class="device-icon server-icon">🖥️</div>
                <div class="device-label">サーバー</div>
                <div class="device-description">Webページを<br>提供する人</div>
            </div>
        </div>
        
        <div class="examples-section">
            <div class="examples-title">HTTPがあるから実現できること</div>
            <div class="examples-grid">
                <div class="example-item">
                    <div class="example-icon">🌐</div>
                    <div class="example-text">世界中のWebサイト<br>が見られる</div>
                </div>
                <div class="example-item">
                    <div class="example-icon">📱</div>
                    <div class="example-text">どんなデバイスでも<br>同じページが表示</div>
                </div>
                <div class="example-item">
                    <div class="example-icon">🔗</div>
                    <div class="example-text">リンクをクリックして<br>ページ移動できる</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

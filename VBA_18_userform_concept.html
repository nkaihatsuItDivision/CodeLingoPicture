<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UserFormの概念</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .content { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .form-demo { background: #f0f0f0; border: 2px solid #333; border-radius: 8px; max-width: 350px; margin: 20px auto; overflow: hidden; }
    .form-titlebar { background: linear-gradient(180deg, #0078d7, #0063b1); color: #fff; padding: 8px 12px; display: flex; justify-content: space-between; align-items: center; }
    .form-titlebar-title { font-weight: bold; font-size: 0.9rem; }
    .form-titlebar-close { width: 20px; height: 20px; background: #e81123; border-radius: 2px; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 0.8rem; cursor: pointer; }
    .form-body { padding: 20px; background: #f0f0f0; }
    .form-row { margin-bottom: 15px; }
    .form-label { font-size: 0.9rem; margin-bottom: 5px; display: block; }
    .form-input { width: 100%; padding: 6px 10px; border: 1px solid #999; border-radius: 3px; }
    .form-buttons { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
    .form-btn { padding: 6px 20px; border: 1px solid #999; border-radius: 3px; background: #e1e1e1; cursor: pointer; }
    .form-btn-primary { background: #0078d7; color: #fff; border-color: #0078d7; }
    .comparison { display: flex; gap: 20px; margin: 30px 0; flex-wrap: wrap; }
    .compare-item { flex: 1; min-width: 200px; background: #f8f9fa; border-radius: 8px; padding: 16px; }
    .compare-title { font-weight: bold; margin-bottom: 10px; padding-bottom: 8px; border-bottom: 2px solid; }
    .compare-msgbox .compare-title { color: #856404; border-color: #ffc107; }
    .compare-inputbox .compare-title { color: #0c5460; border-color: #17a2b8; }
    .compare-userform .compare-title { color: #155724; border-color: #28a745; }
    .compare-list { font-size: 0.9rem; }
    .compare-list li { margin: 6px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>UserForm = カスタム入力画面</h1>
    <div class="content">
      <div class="form-demo">
        <div class="form-titlebar">
          <span class="form-titlebar-title">従業員登録</span>
          <div class="form-titlebar-close">×</div>
        </div>
        <div class="form-body">
          <div class="form-row">
            <label class="form-label">社員番号:</label>
            <input type="text" class="form-input" value="1001">
          </div>
          <div class="form-row">
            <label class="form-label">氏名:</label>
            <input type="text" class="form-input" value="田中太郎">
          </div>
          <div class="form-row">
            <label class="form-label">部署:</label>
            <input type="text" class="form-input" value="営業部">
          </div>
          <div class="form-buttons">
            <button class="form-btn">キャンセル</button>
            <button class="form-btn form-btn-primary">登録</button>
          </div>
        </div>
      </div>
      
      <div class="comparison">
        <div class="compare-item compare-msgbox">
          <div class="compare-title">MsgBox</div>
          <ul class="compare-list">
            <li>メッセージ表示のみ</li>
            <li>Yes/No選択程度</li>
          </ul>
        </div>
        <div class="compare-item compare-inputbox">
          <div class="compare-title">InputBox</div>
          <ul class="compare-list">
            <li>1項目の入力</li>
            <li>検証が難しい</li>
          </ul>
        </div>
        <div class="compare-item compare-userform">
          <div class="compare-title">UserForm</div>
          <ul class="compare-list">
            <li>複数項目の入力</li>
            <li>入力検証が可能</li>
            <li>自由にデザイン</li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ファイルの基本要素</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Yu Gothic', 'Hiragino Sans', Arial, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 800px;
            width: 100%;
        }

        .title {
            text-align: center;
            color: #2c3e50;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 40px;
            border-bottom: 3px solid #3498db;
            padding-bottom: 15px;
        }

        .file-example {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 40px 0;
            padding: 30px;
            background: linear-gradient(45deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
            font-size: 36px;
            font-weight: bold;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .file-icon {
            width: 60px;
            height: 60px;
            background: #fff;
            border-radius: 8px;
            margin-right: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #667eea;
        }

        .elements-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-top: 40px;
        }

        .element-card {
            background: white;
            border: 2px solid #e1e8ed;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .element-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #3498db, #2ecc71, #f39c12);
        }

        .element-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.1);
            border-color: #3498db;
        }

        .element-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: linear-gradient(45deg, #3498db, #2ecc71);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 8px 16px rgba(52, 152, 219, 0.3);
        }

        .element-title {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .element-description {
            font-size: 14px;
            color: #7f8c8d;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .element-example {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 16px;
            color: #2c3e50;
            border-left: 4px solid #3498db;
        }

        .highlight {
            background: linear-gradient(120deg, #a8edea 0%, #fed6e3 100%);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
        }

        .breakdown {
            margin-top: 40px;
            padding: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 15px;
            color: white;
        }

        .breakdown-title {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 25px;
        }

        .breakdown-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .breakdown-item {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .breakdown-item h4 {
            margin: 0 0 10px 0;
            font-size: 18px;
            color: #ffeaa7;
        }

        .breakdown-item p {
            margin: 0;
            font-size: 16px;
            opacity: 0.9;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
                margin: 10px;
            }
            
            .file-example {
                font-size: 24px;
                flex-direction: column;
                text-align: center;
            }
            
            .file-icon {
                margin: 0 0 15px 0;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">📄 ファイルの基本要素</h1>
        
        <div class="file-example">
            <div class="file-icon">📷</div>
            <span>写真1.jpg</span>
        </div>

        <div class="elements-grid">
            <div class="element-card">
                <div class="element-icon">📝</div>
                <div class="element-title">ファイル名</div>
                <div class="element-description">
                    何のファイルかを表す名前<br>
                    分かりやすい名前をつけることが大切
                </div>
                <div class="element-example">
                    <span class="highlight">写真1</span>
                </div>
            </div>

            <div class="element-card">
                <div class="element-icon">🏷️</div>
                <div class="element-title">拡張子</div>
                <div class="element-description">
                    ファイルの種類を表す記号<br>
                    ファイルの「正体」を示す重要な情報
                </div>
                <div class="element-example">
                    <span class="highlight">.jpg</span><br>
                    <small>(画像ファイルの証)</small>
                </div>
            </div>

            <div class="element-card">
                <div class="element-icon">📊</div>
                <div class="element-title">ファイルサイズ</div>
                <div class="element-description">
                    そのファイルがどのくらいの容量を使うか<br>
                    大きいファイルは容量を多く消費
                </div>
                <div class="element-example">
                    <span class="highlight">2.5MB</span><br>
                    <small>(メガバイト)</small>
                </div>
            </div>
        </div>

        <div class="breakdown">
            <div class="breakdown-title">🔍 「写真1.jpg」の詳細分析</div>
            <div class="breakdown-items">
                <div class="breakdown-item">
                    <h4>ファイル名部分</h4>
                    <p>写真1</p>
                </div>
                <div class="breakdown-item">
                    <h4>拡張子部分</h4>
                    <p>.jpg</p>
                </div>
                <div class="breakdown-item">
                    <h4>ファイル種別</h4>
                    <p>画像ファイル</p>
                </div>
                <div class="breakdown-item">
                    <h4>容量サイズ</h4>
                    <p>2.5MB</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

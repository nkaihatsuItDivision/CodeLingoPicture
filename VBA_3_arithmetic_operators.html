<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>算術演算子一覧</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .table-container { background: #fff; border-radius: 16px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #11998e; color: #fff; padding: 14px 12px; text-align: left; font-size: 1rem; }
    td { padding: 14px 12px; border-bottom: 1px solid #eee; }
    tr:hover { background: #f8f9fa; }
    .operator { font-size: 1.5rem; font-weight: bold; color: #11998e; text-align: center; font-family: 'Consolas', monospace; }
    .example { font-family: 'Consolas', monospace; background: #f5f5f5; padding: 4px 8px; border-radius: 4px; }
    .result { font-weight: bold; color: #e74c3c; }
    .note { background: #fff3cd; border-left: 4px solid #ffc107; padding: 16px; margin-top: 20px; border-radius: 0 8px 8px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔢 算術演算子一覧</h1>
    <div class="table-container">
      <table>
        <tr>
          <th>演算子</th>
          <th>意味</th>
          <th>例</th>
          <th>結果</th>
        </tr>
        <tr>
          <td class="operator">+</td>
          <td>足し算</td>
          <td class="example">10 + 3</td>
          <td class="result">13</td>
        </tr>
        <tr>
          <td class="operator">-</td>
          <td>引き算</td>
          <td class="example">10 - 3</td>
          <td class="result">7</td>
        </tr>
        <tr>
          <td class="operator">*</td>
          <td>掛け算</td>
          <td class="example">10 * 3</td>
          <td class="result">30</td>
        </tr>
        <tr>
          <td class="operator">/</td>
          <td>割り算</td>
          <td class="example">10 / 3</td>
          <td class="result">3.333...</td>
        </tr>
        <tr>
          <td class="operator">\</td>
          <td>整数の割り算</td>
          <td class="example">10 \ 3</td>
          <td class="result">3</td>
        </tr>
        <tr>
          <td class="operator">Mod</td>
          <td>余り</td>
          <td class="example">10 Mod 3</td>
          <td class="result">1</td>
        </tr>
        <tr>
          <td class="operator">^</td>
          <td>べき乗</td>
          <td class="example">2 ^ 3</td>
          <td class="result">8</td>
        </tr>
      </table>
      <div class="note">
        <strong>💡 優先順位</strong>：^ → * / → \ → Mod → + -<br>
        迷ったら<strong>カッコ ( )</strong>を使いましょう！
      </div>
    </div>
  </div>
</body>
</html>

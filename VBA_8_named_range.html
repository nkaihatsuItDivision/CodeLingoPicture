<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名前定義の仕組み</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .content { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .comparison { display: flex; gap: 20px; margin: 20px 0; flex-wrap: wrap; justify-content: center; }
    .example { flex: 1; min-width: 300px; }
    .example-title { font-weight: bold; margin-bottom: 10px; padding: 8px; border-radius: 6px; text-align: center; }
    .bad .example-title { background: #f8d7da; color: #721c24; }
    .good .example-title { background: #d4edda; color: #155724; }
    .code-block { background: #1e1e1e; border-radius: 8px; padding: 16px; }
    .code-block pre { color: #d4d4d4; font-family: 'Consolas', monospace; font-size: 0.85rem; line-height: 1.6; }
    .keyword { color: #569cd6; }
    .string { color: #ce9178; }
    .comment { color: #6a9955; }
    .excel-demo { background: #f0f0f0; border: 2px solid #ccc; border-radius: 8px; padding: 16px; margin: 20px 0; }
    .name-box { background: #fff3cd; border: 2px solid #ffc107; border-radius: 8px; padding: 12px; display: inline-flex; align-items: center; gap: 10px; margin: 5px; }
    .name-label { font-weight: bold; color: #856404; }
    .name-ref { font-family: 'Consolas', monospace; color: #666; }
    .arrow { margin: 0 10px; color: #666; }
    .benefits { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 20px; }
    .benefit { background: #e8f5e9; border-radius: 8px; padding: 12px; text-align: center; }
    .benefit-icon { font-size: 1.5rem; margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>名前定義（Names）の仕組み</h1>
    <div class="content">
      <h3 style="margin-bottom: 16px;">名前定義 = セル範囲に名前をつける</h3>
      <div class="excel-demo">
        <div class="name-box">
          <span class="name-label">消費税率</span>
          <span class="arrow">→</span>
          <span class="name-ref">=設定!$B$2</span>
        </div>
        <div class="name-box">
          <span class="name-label">商品リスト</span>
          <span class="arrow">→</span>
          <span class="name-ref">=データ!$A$2:$A$100</span>
        </div>
      </div>
      
      <div class="comparison">
        <div class="example bad">
          <div class="example-title">❌ 名前定義なし</div>
          <div class="code-block">
            <pre>taxRate = Sheets(<span class="string">"設定"</span>).Range(<span class="string">"B2"</span>).Value
<span class="comment">' B2が何を意味するか不明...</span></pre>
          </div>
        </div>
        <div class="example good">
          <div class="example-title">✅ 名前定義あり</div>
          <div class="code-block">
            <pre>taxRate = Range(<span class="string">"消費税率"</span>).Value
<span class="comment">' 意味が一目でわかる！</span></pre>
          </div>
        </div>
      </div>
      
      <div class="benefits">
        <div class="benefit">
          <div class="benefit-icon">📖</div>
          <strong>読みやすい</strong><br>
          <small>コードの意味が明確</small>
        </div>
        <div class="benefit">
          <div class="benefit-icon">🔧</div>
          <strong>変更が簡単</strong><br>
          <small>範囲変更はExcel側で</small>
        </div>
        <div class="benefit">
          <div class="benefit-icon">🛡️</div>
          <strong>エラー防止</strong><br>
          <small>ハードコード削減</small>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>引数の仕組み</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .flow-container { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .flow { display: flex; align-items: center; justify-content: center; gap: 20px; flex-wrap: wrap; margin: 20px 0; }
    .caller { background: #e3f2fd; border: 3px solid #2196f3; border-radius: 12px; padding: 20px; text-align: center; }
    .callee { background: #d4edda; border: 3px solid #28a745; border-radius: 12px; padding: 20px; text-align: center; }
    .box-title { font-weight: bold; margin-bottom: 10px; }
    .caller .box-title { color: #1565c0; }
    .callee .box-title { color: #155724; }
    .arrow { font-size: 2rem; color: #f39c12; }
    .param-box { background: #fff3cd; border: 2px solid #ffc107; border-radius: 8px; padding: 8px 16px; margin: 5px; display: inline-block; }
    .code-block { background: #1e1e1e; border-radius: 8px; padding: 20px; margin-top: 24px; }
    .code-block pre { color: #d4d4d4; font-family: 'Consolas', monospace; font-size: 0.9rem; line-height: 1.8; }
    .keyword { color: #569cd6; }
    .string { color: #ce9178; }
    .type { color: #4ec9b0; }
    .note { background: #e8f5e9; border-left: 4px solid #28a745; padding: 16px; margin-top: 20px; border-radius: 0 8px 8px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>引数でデータを渡す</h1>
    <div class="flow-container">
      <div class="flow">
        <div class="caller">
          <div class="box-title">呼び出し元（Main）</div>
          <div class="param-box">"田中"</div>
          <div class="param-box">25</div>
        </div>
        <div class="arrow">→</div>
        <div class="callee">
          <div class="box-title">呼び出し先（ShowProfile）</div>
          <div class="param-box">name = "田中"</div>
          <div class="param-box">age = 25</div>
        </div>
      </div>
      
      <div class="code-block">
        <pre><span class="keyword">Sub</span> Main()
    <span class="keyword">Call</span> ShowProfile(<span class="string">"田中"</span>, 25)  <span style="color:#6a9955">' 引数を渡す</span>
<span class="keyword">End Sub</span>

<span class="keyword">Sub</span> ShowProfile(name <span class="keyword">As</span> <span class="type">String</span>, age <span class="keyword">As</span> <span class="type">Long</span>)
    MsgBox name & <span class="string">"さんは"</span> & age & <span class="string">"歳です"</span>
<span class="keyword">End Sub</span></pre>
      </div>
      
      <div class="note">
        <strong>💡 引数のメリット</strong><br>
        ・同じ処理を<strong>異なるデータ</strong>で実行できる<br>
        ・<strong>汎用的</strong>なプロシージャが作れる<br>
        ・コードの<strong>再利用性</strong>が高まる
      </div>
    </div>
  </div>
</body>
</html>

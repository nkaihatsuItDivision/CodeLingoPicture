<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ワークシート関数として使う</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .content { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .excel-demo { background: #f0f0f0; border: 2px solid #ccc; border-radius: 8px; padding: 20px; margin: 20px 0; }
    .excel-row { display: flex; margin-bottom: 2px; }
    .excel-cell { border: 1px solid #bbb; padding: 8px 12px; min-width: 100px; background: #fff; text-align: center; }
    .excel-header { background: #e0e0e0; font-weight: bold; }
    .excel-formula { background: #fff3cd; font-family: 'Consolas', monospace; }
    .excel-result { background: #d4edda; font-weight: bold; color: #155724; }
    .arrow { text-align: center; font-size: 2rem; color: #27ae60; margin: 15px 0; }
    .code-block { background: #1e1e1e; border-radius: 8px; padding: 20px; margin: 20px 0; }
    .code-block pre { color: #d4d4d4; font-family: 'Consolas', monospace; font-size: 0.9rem; line-height: 1.8; }
    .keyword { color: #569cd6; }
    .type { color: #4ec9b0; }
    .note { background: #fff3cd; border-left: 4px solid #ffc107; padding: 16px; margin-top: 20px; border-radius: 0 8px 8px 0; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Functionをセルから呼び出す</h1>
    <div class="content">
      <h3 style="margin-bottom: 16px;">① VBAで関数を作成</h3>
      <div class="code-block">
        <pre><span class="keyword">Public Function</span> TaxIncluded(price <span class="keyword">As</span> <span class="type">Long</span>) <span class="keyword">As</span> <span class="type">Long</span>
    TaxIncluded = price * 1.1
<span class="keyword">End Function</span></pre>
      </div>
      
      <div class="arrow">↓</div>
      
      <h3 style="margin-bottom: 16px;">② Excelのセルで使う</h3>
      <div class="excel-demo">
        <div class="excel-row">
          <div class="excel-cell excel-header"></div>
          <div class="excel-cell excel-header">A</div>
          <div class="excel-cell excel-header">B</div>
        </div>
        <div class="excel-row">
          <div class="excel-cell excel-header">1</div>
          <div class="excel-cell">税抜価格</div>
          <div class="excel-cell">税込価格</div>
        </div>
        <div class="excel-row">
          <div class="excel-cell excel-header">2</div>
          <div class="excel-cell">1000</div>
          <div class="excel-cell excel-formula">=TaxIncluded(A2)</div>
        </div>
        <div class="excel-row">
          <div class="excel-cell excel-header">3</div>
          <div class="excel-cell">2500</div>
          <div class="excel-cell excel-result">2750</div>
        </div>
      </div>
      
      <div class="note">
        <strong>⚠️ 注意点</strong><br>
        ・<strong>Public</strong> で宣言する必要がある<br>
        ・MsgBoxなど<strong>画面表示は使えない</strong><br>
        ・セルの<strong>書式変更は不可</strong>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>要件定義の基本概念</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #2c3e50;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            padding: 30px;
        }

        .title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 30px;
            border-bottom: 3px solid #17a2b8;
            padding-bottom: 15px;
        }

        .highlight-box {
            background: linear-gradient(135deg, #17a2b8, #0c5460);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            text-align: center;
            font-weight: bold;
            font-size: 20px;
        }

        .concept-box {
            background: linear-gradient(135deg, #e3f2fd, #bbdefb);
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
            border-left: 4px solid #17a2b8;
        }

        .concept-title {
            font-size: 18px;
            font-weight: bold;
            color: #17a2b8;
            margin-bottom: 10px;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .card {
            background: linear-gradient(135deg, #fff, #f8f9fa);
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #17a2b8;
            box-shadow: 0 4px 15px rgba(23, 162, 184, 0.1);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 24px rgba(23, 162, 184, 0.3);
        }

        .card-header {
            font-size: 18px;
            font-weight: bold;
            color: #17a2b8;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
        }

        .card-header .emoji {
            margin-right: 8px;
            font-size: 20px;
        }

        .card-content {
            font-size: 14px;
            color: #555;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .container {
                margin: 10px;
                padding: 20px;
            }

            .title {
                font-size: 22px;
            }

            .content-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .card {
                padding: 15px;
            }

            .card-header {
                font-size: 16px;
            }

            .card-content {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="title">要件定義の基本概念</div>
        
        <div class="highlight-box">
            「何を作るか」を明確に決めること
        </div>

        <div class="concept-box">
            <div class="concept-title">要件定義とは</div>
            システム開発における最初の重要なステップで、作るシステムの機能や性能を明確に定義することです。
        </div>

        <div class="content-grid">
            <div class="card">
                <div class="card-header">
                    <span class="emoji">🎯</span>
                    目的
                </div>
                <div class="card-content">
                    • システムの目標を明確化<br>
                    • 開発チーム全体の認識統一<br>
                    • 後工程での手戻りを防止<br>
                    • プロジェクト成功の基盤確立
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="emoji">⚡</span>
                    重要性
                </div>
                <div class="card-content">
                    • 開発効率の大幅向上<br>
                    • バグや不具合の事前防止<br>
                    • コスト削減とスケジュール遵守<br>
                    • お客様満足度の向上
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <span class="emoji">💼</span>
                    Week 10システムでの例
                </div>
                <div class="card-content">
                    • 学生情報の管理機能<br>
                    • 検索・フィルタリング機能<br>
                    • データエクスポート機能<br>
                    • Ajax による非同期処理
                </div>
            </div>
        </div>
    </div>
</body>
</html>

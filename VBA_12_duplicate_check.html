<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>重複チェックの仕組み</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .content { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .flow { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; justify-content: center; margin: 20px 0; }
    .data-list { background: #f8f9fa; border-radius: 8px; padding: 16px; min-width: 150px; }
    .data-title { font-weight: bold; margin-bottom: 10px; text-align: center; color: #333; }
    .data-item { padding: 8px 12px; margin: 4px 0; border-radius: 4px; text-align: center; }
    .item-new { background: #d4edda; border: 1px solid #28a745; }
    .item-dup { background: #f8d7da; border: 1px solid #dc3545; }
    .arrow { font-size: 2rem; color: #666; align-self: center; }
    .dict-box { background: #e8daef; border: 3px solid #9b59b6; border-radius: 12px; padding: 16px; min-width: 200px; }
    .dict-title { font-weight: bold; color: #6c3483; text-align: center; margin-bottom: 10px; }
    .dict-item { display: flex; justify-content: space-between; padding: 6px 10px; background: #fff; border-radius: 4px; margin: 4px 0; font-size: 0.9rem; }
    .code-block { background: #1e1e1e; border-radius: 8px; padding: 16px; margin-top: 20px; }
    .code-block pre { color: #d4d4d4; font-family: 'Consolas', monospace; font-size: 0.85rem; line-height: 1.6; }
    .keyword { color: #569cd6; }
    .string { color: #ce9178; }
    .comment { color: #6a9955; }
    .step { display: flex; align-items: center; gap: 10px; margin: 10px 0; padding: 10px; background: #f8f9fa; border-radius: 8px; }
    .step-num { width: 28px; height: 28px; background: #667eea; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Dictionaryで重複チェック</h1>
    <div class="content">
      <div class="flow">
        <div class="data-list">
          <div class="data-title">入力データ</div>
          <div class="data-item item-new">田中</div>
          <div class="data-item item-new">山田</div>
          <div class="data-item item-dup">田中 ←重複!</div>
          <div class="data-item item-new">鈴木</div>
          <div class="data-item item-dup">山田 ←重複!</div>
        </div>
        <div class="arrow">→</div>
        <div class="dict-box">
          <div class="dict-title">Dictionary</div>
          <div class="dict-item"><span>田中</span><span>✓</span></div>
          <div class="dict-item"><span>山田</span><span>✓</span></div>
          <div class="dict-item"><span>鈴木</span><span>✓</span></div>
        </div>
      </div>
      
      <div class="step">
        <div class="step-num">1</div>
        <div><strong>Exists</strong>でキーが存在するか確認</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div>存在しない → <strong>Add</strong>で追加</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div>存在する → <span style="color:#dc3545; font-weight:bold;">重複発見！</span></div>
      </div>
      
      <div class="code-block">
        <pre><span class="keyword">If</span> dict.Exists(value) <span class="keyword">Then</span>
    <span class="comment">' 重複発見！</span>
    MsgBox value & <span class="string">" は重複しています"</span>
<span class="keyword">Else</span>
    <span class="comment">' 新規登録</span>
    dict.Add value, <span class="string">""</span>
<span class="keyword">End If</span></pre>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>If文の基本構造</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 700px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .flow-container { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .flow { display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .flow-item { padding: 16px 32px; border-radius: 8px; font-weight: bold; text-align: center; }
    .condition { background: #fff3cd; border: 3px solid #ffc107; color: #856404; clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%); padding: 20px 40px; }
    .process { background: #d4edda; border: 3px solid #28a745; color: #155724; }
    .arrow { font-size: 1.5rem; color: #666; }
    .arrow-label { font-size: 0.9rem; color: #28a745; font-weight: bold; }
    .code-block { background: #1e1e1e; border-radius: 8px; padding: 20px; margin-top: 24px; }
    .code-block pre { color: #d4d4d4; font-family: 'Consolas', monospace; font-size: 0.9rem; line-height: 1.8; }
    .keyword { color: #569cd6; }
    .comment { color: #6a9955; }
  </style>
</head>
<body>
  <div class="container">
    <h1>If文の基本構造</h1>
    <div class="flow-container">
      <div class="flow">
        <div class="flow-item condition">条件を判定<br>score >= 60 ?</div>
        <div class="arrow">↓</div>
        <div class="arrow-label">Trueのとき</div>
        <div class="arrow">↓</div>
        <div class="flow-item process">処理を実行<br>MsgBox "合格です！"</div>
        <div class="arrow">↓</div>
        <div class="flow-item" style="background:#e3f2fd; border:2px solid #2196f3; color:#1565c0;">End If（処理終了）</div>
      </div>
      
      <div class="code-block">
        <pre><span class="keyword">If</span> score >= 60 <span class="keyword">Then</span>
    MsgBox <span class="comment">"合格です！"</span>
<span class="keyword">End If</span></pre>
      </div>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ブラウザでURLを入力している様子</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .browser-container {
            width: 800px;
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .browser-header {
            background: #f1f3f4;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
        }
        
        .browser-buttons {
            display: flex;
            gap: 8px;
            margin-right: 16px;
        }
        
        .browser-button {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        
        .close { background: #ff5f57; }
        .minimize { background: #ffbd2e; }
        .maximize { background: #28ca42; }
        
        .address-bar {
            flex: 1;
            background: white;
            border: 2px solid #4285f4;
            border-radius: 25px;
            padding: 10px 20px;
            font-size: 16px;
            display: flex;
            align-items: center;
            position: relative;
            box-shadow: 0 0 10px rgba(66, 133, 244, 0.3);
        }
        
        .url-text {
            color: #333;
            font-weight: 500;
        }
        
        .cursor {
            display: inline-block;
            width: 2px;
            height: 20px;
            background: #333;
            margin-left: 2px;
        }
        
        .browser-content {
            height: 400px;
            background: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #666;
        }
        
        .loading-text {
            font-size: 18px;
            margin-top: 20px;
            color: #666;
        }
        
        .illustration-title {
            text-align: center;
            color: #333;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 30px;
        }
        
        .description {
            text-align: center;
            color: #666;
            font-size: 16px;
            margin-top: 20px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e9ecef;
        }
        
        .arrow {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: #4285f4;
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div>
        <div class="illustration-title">ブラウザでURLを入力している様子</div>
        
        <div class="browser-container">
            <div class="browser-header">
                <div class="browser-buttons">
                    <div class="browser-button close"></div>
                    <div class="browser-button minimize"></div>
                    <div class="browser-button maximize"></div>
                </div>
                <div class="address-bar">
                    <div class="arrow">↓ここに入力！</div>
                    <span class="url-text">https://www.google.com</span>
                    <span class="cursor"></span>
                </div>
            </div>
            <div class="browser-content">
                <div style="font-size: 48px; color: #ddd;">🌐</div>
                <div class="loading-text">Webページを読み込んでいます...</div>
            </div>
        </div>
        
        <div class="description">
            普段何気なく行っている「URLを入力してEnter」<br>
            この裏側では、サーバーとの複雑なやり取りが始まります
        </div>
    </div>
</body>
</html>

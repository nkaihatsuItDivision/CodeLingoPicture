<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>論理演算子の動作</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .operators { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .op-card { background: #fff; border-radius: 16px; padding: 24px; flex: 1; min-width: 270px; max-width: 280px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .op-title { font-size: 1.3rem; font-weight: bold; text-align: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 3px solid; }
    .op-and .op-title { color: #27ae60; border-color: #27ae60; }
    .op-or .op-title { color: #f39c12; border-color: #f39c12; }
    .op-not .op-title { color: #9b59b6; border-color: #9b59b6; }
    .truth-table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 0.9rem; }
    .truth-table th, .truth-table td { padding: 8px; text-align: center; border: 1px solid #ddd; }
    .truth-table th { background: #f8f9fa; }
    .true { color: #27ae60; font-weight: bold; }
    .false { color: #e74c3c; font-weight: bold; }
    .desc { background: #f8f9fa; border-radius: 8px; padding: 12px; text-align: center; font-size: 0.95rem; }
    .example { font-family: 'Consolas', monospace; background: #1e1e1e; color: #d4d4d4; padding: 12px; border-radius: 6px; margin-top: 12px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔀 論理演算子の動作</h1>
    <div class="operators">
      <div class="op-card op-and">
        <div class="op-title">And（かつ）</div>
        <table class="truth-table">
          <tr><th>A</th><th>B</th><th>A And B</th></tr>
          <tr><td class="true">T</td><td class="true">T</td><td class="true">True</td></tr>
          <tr><td class="true">T</td><td class="false">F</td><td class="false">False</td></tr>
          <tr><td class="false">F</td><td class="true">T</td><td class="false">False</td></tr>
          <tr><td class="false">F</td><td class="false">F</td><td class="false">False</td></tr>
        </table>
        <div class="desc">両方Trueのとき<br><strong>True</strong></div>
        <div class="example">age >= 18 And hasLicense</div>
      </div>
      
      <div class="op-card op-or">
        <div class="op-title">Or（または）</div>
        <table class="truth-table">
          <tr><th>A</th><th>B</th><th>A Or B</th></tr>
          <tr><td class="true">T</td><td class="true">T</td><td class="true">True</td></tr>
          <tr><td class="true">T</td><td class="false">F</td><td class="true">True</td></tr>
          <tr><td class="false">F</td><td class="true">T</td><td class="true">True</td></tr>
          <tr><td class="false">F</td><td class="false">F</td><td class="false">False</td></tr>
        </table>
        <div class="desc">どちらかTrueのとき<br><strong>True</strong></div>
        <div class="example">day = "土" Or day = "日"</div>
      </div>
      
      <div class="op-card op-not">
        <div class="op-title">Not（否定）</div>
        <table class="truth-table">
          <tr><th>A</th><th>Not A</th></tr>
          <tr><td class="true">True</td><td class="false">False</td></tr>
          <tr><td class="false">False</td><td class="true">True</td></tr>
        </table>
        <div class="desc">TrueとFalseを<br><strong>反転</strong></div>
        <div class="example">Not isComplete</div>
      </div>
    </div>
  </div>
</body>
</html>

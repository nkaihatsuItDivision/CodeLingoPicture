<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enum（列挙型）のイメージ</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .comparison { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .panel { background: #fff; border-radius: 16px; padding: 24px; flex: 1; min-width: 350px; max-width: 420px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .panel-before { border-top: 6px solid #e74c3c; }
    .panel-after { border-top: 6px solid #27ae60; }
    .panel-title { font-size: 1.1rem; font-weight: bold; margin-bottom: 16px; text-align: center; }
    .panel-before .panel-title { color: #e74c3c; }
    .panel-after .panel-title { color: #27ae60; }
    .const-list { display: flex; flex-direction: column; gap: 8px; margin: 16px 0; }
    .const-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: #f8f9fa; border-radius: 6px; }
    .const-name { font-family: 'Consolas', monospace; min-width: 180px; }
    .const-value { background: #e3f2fd; padding: 4px 12px; border-radius: 4px; font-weight: bold; }
    .enum-box { background: #e8f5e9; border: 3px solid #27ae60; border-radius: 12px; padding: 16px; margin: 16px 0; }
    .enum-title { font-weight: bold; color: #27ae60; margin-bottom: 12px; font-family: 'Consolas', monospace; }
    .enum-item { display: flex; justify-content: space-between; padding: 8px 12px; background: #fff; border-radius: 4px; margin: 4px 0; font-family: 'Consolas', monospace; }
    .code-block { background: #1e1e1e; border-radius: 6px; padding: 12px; margin-top: 16px; }
    .code-block pre { color: #d4d4d4; font-family: 'Consolas', monospace; font-size: 0.8rem; line-height: 1.5; }
    .keyword { color: #569cd6; }
    .number { color: #b5cea8; }
    .comment { color: #6a9955; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Enum = 関連する定数をグループ化</h1>
    <div class="comparison">
      <div class="panel panel-before">
        <div class="panel-title">❌ バラバラの定数</div>
        <div class="const-list">
          <div class="const-item"><span class="const-name">Const STATUS_PENDING</span><span class="const-value">0</span></div>
          <div class="const-item"><span class="const-name">Const STATUS_APPROVED</span><span class="const-value">1</span></div>
          <div class="const-item"><span class="const-name">Const STATUS_REJECTED</span><span class="const-value">2</span></div>
          <div class="const-item"><span class="const-name">Const STATUS_COMPLETE</span><span class="const-value">3</span></div>
        </div>
        <p style="color:#666; font-size:0.9rem; text-align:center;">関連性がわかりにくい...</p>
      </div>
      
      <div class="panel panel-after">
        <div class="panel-title">✅ Enumでグループ化</div>
        <div class="enum-box">
          <div class="enum-title">Enum OrderStatus</div>
          <div class="enum-item"><span>Pending</span><span>= 0</span></div>
          <div class="enum-item"><span>Approved</span><span>= 1</span></div>
          <div class="enum-item"><span>Rejected</span><span>= 2</span></div>
          <div class="enum-item"><span>Complete</span><span>= 3</span></div>
        </div>
        <div class="code-block">
          <pre><span class="keyword">Dim</span> status <span class="keyword">As</span> OrderStatus
status = Approved  <span class="comment">' 型が明確！</span></pre>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

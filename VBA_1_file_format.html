<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ファイル形式の違い</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #0984e3 0%, #74b9ff 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .formats { display: flex; flex-direction: column; gap: 16px; }
    .format-card { background: #fff; border-radius: 16px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); display: flex; align-items: center; gap: 20px; }
    .format-icon { width: 60px; height: 60px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.8rem; flex-shrink: 0; }
    .format-content { flex: 1; }
    .format-ext { font-size: 1.3rem; font-weight: bold; font-family: 'Consolas', monospace; }
    .format-name { color: #666; font-size: 0.9rem; margin-top: 4px; }
    .format-status { display: flex; align-items: center; gap: 8px; }
    .badge { padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: bold; }
    .badge-no { background: #ffe0e0; color: #e74c3c; }
    .badge-yes { background: #d4edda; color: #27ae60; }
    .badge-old { background: #fff3cd; color: #856404; }
    .recommend { background: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%); border: 3px solid #27ae60; }
    .recommend .format-icon { background: #d4edda; }
    .recommend .format-ext { color: #27ae60; }
    .recommend-badge { background: #27ae60; color: #fff; padding: 4px 10px; border-radius: 4px; font-size: 0.75rem; margin-left: 10px; }
    .not-recommend { opacity: 0.7; }
    .not-recommend .format-icon { background: #f8f9fa; }
    .note { background: #fff; border-radius: 12px; padding: 20px; margin-top: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
    .note-title { color: #e74c3c; font-weight: bold; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
    .note-text { color: #333; font-size: 0.95rem; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Excelファイル形式の違い</h1>
    <div class="formats">
      <div class="format-card not-recommend">
        <div class="format-icon">📊</div>
        <div class="format-content">
          <div class="format-ext">.xlsx</div>
          <div class="format-name">Excel ブック</div>
        </div>
        <div class="format-status">
          <span class="badge badge-no">❌ マクロ保存不可</span>
        </div>
      </div>
      <div class="format-card recommend">
        <div class="format-icon">📊</div>
        <div class="format-content">
          <div class="format-ext">.xlsm <span class="recommend-badge">おすすめ</span></div>
          <div class="format-name">Excel マクロ有効ブック</div>
        </div>
        <div class="format-status">
          <span class="badge badge-yes">✅ マクロ保存可能</span>
        </div>
      </div>
      <div class="format-card not-recommend">
        <div class="format-icon">📊</div>
        <div class="format-content">
          <div class="format-ext">.xls</div>
          <div class="format-name">Excel 97-2003 ブック</div>
        </div>
        <div class="format-status">
          <span class="badge badge-old">⚠️ 古い形式</span>
        </div>
      </div>
    </div>
    <div class="note">
      <div class="note-title">⚠️ 注意</div>
      <div class="note-text">
        VBAコードを含むファイルを <strong>.xlsx</strong> で保存しようとすると、警告メッセージが表示されます。<br>
        必ず <strong>.xlsm</strong>（マクロ有効ブック）形式で保存してください。
      </div>
    </div>
  </div>
</body>
</html>

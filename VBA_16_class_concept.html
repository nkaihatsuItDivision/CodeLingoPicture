<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>クラスの概念</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .content { background: #fff; border-radius: 16px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .analogy { display: flex; gap: 30px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 20px 0; }
    .blueprint { background: #e3f2fd; border: 3px dashed #2196f3; border-radius: 12px; padding: 20px; text-align: center; min-width: 200px; }
    .blueprint-title { font-weight: bold; color: #1565c0; margin-bottom: 12px; font-size: 1.1rem; }
    .blueprint-content { font-size: 0.9rem; color: #666; }
    .arrow { font-size: 2rem; color: #666; }
    .instances { display: flex; gap: 15px; }
    .instance { background: #d4edda; border: 3px solid #28a745; border-radius: 12px; padding: 16px; text-align: center; min-width: 100px; }
    .instance-title { font-weight: bold; color: #155724; margin-bottom: 8px; }
    .instance-data { font-size: 0.85rem; color: #666; }
    .class-box { display: flex; gap: 30px; margin: 30px 0; flex-wrap: wrap; justify-content: center; }
    .class-section { flex: 1; min-width: 280px; }
    .section-title { font-weight: bold; padding: 10px 16px; border-radius: 8px 8px 0 0; }
    .props-title { background: #fff3cd; color: #856404; }
    .methods-title { background: #cce5ff; color: #004085; }
    .section-content { border: 2px solid #ddd; border-top: none; border-radius: 0 0 8px 8px; padding: 12px; }
    .item { padding: 8px; background: #f8f9fa; border-radius: 4px; margin: 6px 0; font-family: 'Consolas', monospace; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>クラス = 設計図 / オブジェクト = 実体</h1>
    <div class="content">
      <div class="analogy">
        <div class="blueprint">
          <div class="blueprint-title">📐 クラス（設計図）</div>
          <div class="blueprint-content">
            Employee クラス<br>
            ・名前<br>
            ・部署<br>
            ・給与計算()
          </div>
        </div>
        <div class="arrow">→</div>
        <div class="instances">
          <div class="instance">
            <div class="instance-title">👤 オブジェクト1</div>
            <div class="instance-data">田中太郎<br>営業部</div>
          </div>
          <div class="instance">
            <div class="instance-title">👤 オブジェクト2</div>
            <div class="instance-data">山田花子<br>開発部</div>
          </div>
        </div>
      </div>
      
      <div class="class-box">
        <div class="class-section">
          <div class="section-title props-title">📦 プロパティ（データ）</div>
          <div class="section-content">
            <div class="item">Name As String</div>
            <div class="item">Department As String</div>
            <div class="item">Salary As Long</div>
          </div>
        </div>
        <div class="class-section">
          <div class="section-title methods-title">⚙️ メソッド（処理）</div>
          <div class="section-content">
            <div class="item">Sub Calculate()</div>
            <div class="item">Function GetInfo()</div>
            <div class="item">Sub Update()</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

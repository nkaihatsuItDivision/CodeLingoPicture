<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VBA導入によるBefore/After</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; }
    h1 { color: #fff; text-align: center; margin-bottom: 30px; font-size: 1.8rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    .comparison { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
    .box { background: #fff; border-radius: 16px; padding: 24px; width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .box-before { border-top: 6px solid #e74c3c; }
    .box-after { border-top: 6px solid #27ae60; }
    .box-title { font-size: 1.4rem; font-weight: bold; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
    .box-before .box-title { color: #e74c3c; }
    .box-after .box-title { color: #27ae60; }
    .icon { font-size: 1.6rem; }
    .item { display: flex; align-items: center; gap: 12px; padding: 12px; margin: 8px 0; background: #f8f9fa; border-radius: 8px; }
    .box-before .item { border-left: 4px solid #e74c3c; }
    .box-after .item { border-left: 4px solid #27ae60; }
    .item-icon { font-size: 1.2rem; }
    .item-text { font-size: 0.95rem; color: #333; }
    .time-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold; margin-top: 16px; font-size: 0.9rem; }
    .box-before .time-badge { background: #fdeaea; color: #e74c3c; }
    .box-after .time-badge { background: #e8f8f0; color: #27ae60; }
    .arrow { font-size: 3rem; color: #fff; display: flex; align-items: center; text-shadow: 2px 2px 4px rgba(0,0,0,0.3); }
    @media (max-width: 900px) {
      .comparison { flex-direction: column; align-items: center; }
      .arrow { transform: rotate(90deg); margin: 10px 0; }
      .box { width: 100%; max-width: 400px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>VBA導入による Before / After</h1>
    <div class="comparison">
      <div class="box box-before">
        <div class="box-title"><span class="icon">😰</span> Before（手作業）</div>
        <div class="item">
          <span class="item-icon">🔄</span>
          <span class="item-text">毎回同じ作業を繰り返す</span>
        </div>
        <div class="item">
          <span class="item-icon">⏰</span>
          <span class="item-text">時間がかかる</span>
        </div>
        <div class="item">
          <span class="item-icon">⚠️</span>
          <span class="item-text">ミスが発生しやすい</span>
        </div>
        <div class="item">
          <span class="item-icon">👥</span>
          <span class="item-text">作業者によって結果が異なる</span>
        </div>
        <div class="time-badge">⏱️ 30分〜1時間</div>
      </div>
      <div class="arrow">→</div>
      <div class="box box-after">
        <div class="box-title"><span class="icon">😊</span> After（VBA自動化）</div>
        <div class="item">
          <span class="item-icon">🖱️</span>
          <span class="item-text">ボタン1つで完了</span>
        </div>
        <div class="item">
          <span class="item-icon">⚡</span>
          <span class="item-text">数秒で処理完了</span>
        </div>
        <div class="item">
          <span class="item-icon">✅</span>
          <span class="item-text">ミスがない（プログラム通り）</span>
        </div>
        <div class="item">
          <span class="item-icon">🎯</span>
          <span class="item-text">誰がやっても同じ結果</span>
        </div>
        <div class="time-badge">⚡ 数秒</div>
      </div>
    </div>
  </div>
</body>
</html>
